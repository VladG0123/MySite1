  <header>

  <main>
   
  <section class="seller-panel">

  <form id="product-form">
    <input id="product-name" type="text" placeholder="Назва товару" required>

<div id="cart-window" class="cart-window">
  <h2>Мій кошик</h2>

  <div id="cart-items">
    Кошик порожній
  </div>

  <p>Разом: <span id="cart-total">0</span> грн</p>

  <div id="contact-window" class="contact-window">

  <button id="close-contact">Закрити</button>
</div>
</div>
<div id="product-modal" class="product-modal">
  <div class="product-modal-content">
    <button id="close-product-modal" class="close-product-modal">×</button>

    <div class="product-modal-gallery">
      <img id="modal-main-image" src="" alt="Фото товару">

      <div id="modal-gallery" class="modal-gallery"></div>
    </div>

    <div class="product-modal-info">
      <h2 id="modal-product-name"></h2>
      <p id="modal-product-description"></p>
      <p id="modal-product-price" class="price"></p>

      <button id="modal-add-cart">Додати в кошик</button>
    </div>
  </div>
</div>
<div id="edit-product-modal" class="product-modal">
  <div class="product-modal-content edit-product-content">
    <button id="close-edit-modal" class="close-product-modal">×</button>

    <h2>Редагувати товар</h2>

    <form id="edit-product-form">
      <input id="edit-product-name" type="text" required>

      <textarea id="edit-product-description" required></textarea>

      <input id="edit-product-price" type="number" min="1" required>

      <label>
        Додати нові фото
        <input id="edit-product-images" type="file" accept="image/*" multiple>
      </label>

      <button type="submit">Зберегти зміни</button>
    </form>
  </div>
</div>

  <footer>
    <p>© 2026 Мій сайт</p>
 </footer>
<script>
  let items = [];

let products = JSON.parse(
  localStorage.getItem("vladmarket-products") || "[]"
);

let openedProduct = null;

const productList = document.getElementById("products-list");
const productForm = document.getElementById("product-form");

function getImages(product) {
  if (product.images && product.images.length > 0) {
    return product.images;
  }

  if (product.image) {
    return [product.image];
  }

  return [];
}

function saveProducts() {
  localStorage.setItem("vladmarket-products", JSON.stringify(products));
}

function addToCart(product) {
  items.push({
    name: product.name,
    price: product.price
  });

  showCart();
}

function showCart() {
  let total = 0;
  const cartItems = document.getElementById("cart-items");

  cartItems.innerHTML = "";

  if (items.length === 0) {
    cartItems.textContent = "Кошик порожній";
  }

  items.forEach(function (item, index) {
    total = total + item.price;

    const row = document.createElement("p");
    const text = document.createElement("span");

    text.textContent = item.name + " — " + item.price + " грн";

    const removeButton = document.createElement("button");
    removeButton.textContent = "Видалити";

    removeButton.addEventListener("click", function () {
      items.splice(index, 1);
      showCart();
    });

    row.appendChild(text);
    row.appendChild(removeButton);
    cartItems.appendChild(row);
  });

  document.getElementById("cart-count").textContent = items.length;
  document.getElementById("cart-total").textContent = total;
}

function openProduct(product) {
  openedProduct = product;

  const images = getImages(product);

  document.getElementById("modal-product-name").textContent = product.name;
  document.getElementById("modal-product-description").textContent =
    product.description;
  document.getElementById("modal-product-price").textContent =
    product.price + " грн";

  const mainImage = document.getElementById("modal-main-image");
  const gallery = document.getElementById("modal-gallery");

  mainImage.src = images[0];
  gallery.innerHTML = "";

  images.forEach(function (imageUrl, index) {
    const imageButton = document.createElement("button");
    imageButton.className = "gallery-image-button";

    const image = document.createElement("img");
    image.src = imageUrl;
    image.alt = product.name + " фото " + (index + 1);

    imageButton.appendChild(image);

    imageButton.addEventListener("click", function () {
      mainImage.src = imageUrl;
    });

    gallery.appendChild(imageButton);
  });

  document.getElementById("product-modal").style.display = "flex";
}

function renderProducts() {
  productList.innerHTML = "";

  if (products.length === 0) {
    productList.textContent = "Товарів ще немає. Додайте перший!";
    return;
  }

  products.forEach(function (product) {
    const images = getImages(product);

    const card = document.createElement("article");
    card.className = "product";

    const image = document.createElement("img");
    image.className = "product-preview";
    image.src = images[0];
    image.alt = product.name;

    image.addEventListener("click", function () {
      openProduct(product);
    });

    const name = document.createElement("h3");
    name.textContent = product.name;

    const description = document.createElement("p");
    description.textContent = product.description;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = product.price + " грн";

    const viewButton = document.createElement("button");
    viewButton.className = "view-product";
    viewButton.textContent = "Переглянути товар";

    viewButton.addEventListener("click", function () {
      openProduct(product);
    });
const editButton = document.createElement("button");
editButton.className = "edit-product";
editButton.textContent = "Редагувати";

editButton.addEventListener("click", function () {
  openEditProduct(product);
});
    const addButton = document.createElement("button");
    addButton.textContent = "Додати в кошик";

    addButton.addEventListener("click", function () {
      addToCart(product);
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-product";
    deleteButton.textContent = "Видалити товар";

    deleteButton.addEventListener("click", function () {
      if (confirm("Видалити товар «" + product.name + "»?")) {
        products = products.filter(function (item) {
          return item.id !== product.id;
        });

        saveProducts();
        renderProducts();
      }
    });

    const actions = document.createElement("div");
    actions.className = "product-actions";

    actions.appendChild(viewButton);
actions.appendChild(editButton);
actions.appendChild(addButton);
actions.appendChild(deleteButton);

    card.appendChild(image);
    card.appendChild(name);
    card.appendChild(description);
    card.appendChild(price);
    card.appendChild(actions);

    productList.appendChild(card);
  });
}

productForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const files = Array.from(
    document.getElementById("product-image").files
  );

  if (files.length === 0) {
    return;
  }

  const imagePromises = files.map(function (file) {
    return new Promise(function (resolve) {
      const reader = new FileReader();

      reader.addEventListener("load", function () {
        resolve(reader.result);
      });

      reader.readAsDataURL(file);
    });
  });

  Promise.all(imagePromises).then(function (images) {
    products.unshift({
      id: Date.now(),
      name: document.getElementById("product-name").value,
      description: document.getElementById("product-description").value,
      price: Number(document.getElementById("product-price").value),
      images: images
    });

    saveProducts();
    renderProducts();
    productForm.reset();
  });
});

document.getElementById("open-cart").addEventListener("click", function () {
  document.getElementById("cart-window").style.display = "block";
});

document.getElementById("close-cart").addEventListener("click", function () {
  document.getElementById("cart-window").style.display = "none";
});

document.getElementById("close-product-modal").addEventListener("click", function () {
  document.getElementById("product-modal").style.display = "none";
});

document.getElementById("modal-add-cart").addEventListener("click", function () {
  if (openedProduct) {
    addToCart(openedProduct);
  }
});

let editingProductId = null;

function openEditProduct(product) {
  editingProductId = product.id;

  document.getElementById("edit-product-name").value = product.name;
  document.getElementById("edit-product-description").value =
    product.description;
  document.getElementById("edit-product-price").value = product.price;

  document.getElementById("edit-product-modal").style.display = "flex";
}

document.getElementById("close-edit-modal").addEventListener("click", function () {
  document.getElementById("edit-product-modal").style.display = "none";
});

document.getElementById("edit-product-form").addEventListener("submit", function (event) {
  event.preventDefault();

  const product = products.find(function (item) {
    return item.id === editingProductId;
  });

  if (!product) {
    return;
  }

  product.name = document.getElementById("edit-product-name").value;
  product.description =
    document.getElementById("edit-product-description").value;
  product.price = Number(
    document.getElementById("edit-product-price").value
  );

  const files = Array.from(
    document.getElementById("edit-product-images").files
  );

  if (files.length === 0) {
    saveProducts();
    renderProducts();
    document.getElementById("edit-product-modal").style.display = "none";
    return;
  }

  const imagePromises = files.map(function (file) {
    return new Promise(function (resolve) {
      const reader = new FileReader();

      reader.addEventListener("load", function () {
        resolve(reader.result);
      });

      reader.readAsDataURL(file);
    });
  });

  Promise.all(imagePromises).then(function (newImages) {
    product.images = getImages(product).concat(newImages);

    saveProducts();
    renderProducts();

    document.getElementById("edit-product-modal").style.display = "none";
    document.getElementById("edit-product-form").reset();
  });
});

renderProducts();
showCart();
</script>

</body>
</html>
